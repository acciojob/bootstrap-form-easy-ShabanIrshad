<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body>
	<h1 class='w-50 m-auto'>Internship Form</h1>
	<!-- the entire body must be written by student -->
	<div class='container'>
		<div class='row'>
			<div class='col-sm-4'>
				<label for='first-name-input'>First Name</label>
				<input  class='border-3  rounded-3' type='text' id='first-name-input' required/>
			</div>
			<div class='col-sm-4'>
				<label for='last-name-input'>Last Name</label>
				<input  class='border-3  rounded-3' type='text' id='last-name-input' required/>
			</div>
			<div class='col-sm-4'>
				<label for='email-input'>Email Address</label>
				<input  class='border-3  rounded-3' type='text' placeholder='xyz@abc.com' id='email-input' required/>
			</div>
		</div>
		<div class='row'>
			<div class='col-sm-6'>
				<label for='college-input'>Collage</label>
				<input  class='border-3  rounded-3' type='text' id='college-input' required/>
			</div>
			<div class='col-sm-3'>
				<label for='graduation-year-input'>Graduation Year</label>
				<select  id='graduation-year-input'class="form-select border-3  rounded-3" aria-label="Large select example">
				  <option selected>Choose..</option>
				  <option value="1">2020</option>
				  <option value="2">2022</option>
				  <option value="3">2022</option>
					<option value="3">2023</option>
				</select>
			</div>
			<div class='col-sm-3'>
				<label for='roll-no-input'>Roll No.</label>
				<input  class='border-3  rounded-3' type='text'  id='roll-no-input' required/>
			</div>
		</div>
		<div class='row'>
			<div class='col-sm-12'>
			<input type='checkbox' id='conditions-checkbox'/>
			<label for='conditions-checkbox'>Agree to terms and conditions.</label>
			</div>
		</div>
		<div class='row'>
			<div class='col-sm-12'>
			<input type='Submit'/>
			
			</div>
		</div>
	</div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
